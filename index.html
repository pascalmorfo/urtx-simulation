<title>URTX, simulation du risque</title>
<style>
:root{--bg:#F5F7FA;--surface:#fff;--ink:#13203B;--muted:#5A6478;--line:#DDE3EC;--blue:#1A56FF;--red:#B8433A;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1522;--surface:#172033;--ink:#E7ECF5;--muted:#9AA5BA;--line:#2A3550;--blue:#6E95FF;--red:#E57A70;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,"Segoe UI",system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:24px}
form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:380px}
h1{font-size:20px;margin:0 0 6px}p{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.5}
label{font-size:13px;font-weight:600;display:block;margin-bottom:6px}
input{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button{width:100%;margin-top:14px;font:inherit;font-weight:700;font-size:15px;padding:11px;border:0;border-radius:8px;background:var(--blue);color:#fff;cursor:pointer}
input:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.err{color:var(--red);font-size:13px;margin-top:10px;min-height:1em}
</style></head><body>

<input id="p" type="password" autocomplete="current-password" autofocus required>
<button type="submit">Ouvrir la simulation</button>

</form>

async function open(pwd){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pwd),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},key,u(D.c));
  return new TextDecoder().decode(pt);
}
async function go(pwd,quiet){
  try{const h=await open(pwd);try{sessionStorage.setItem("urtx",pwd)}catch(_){}
    document.open();document.write(h);document.close();}
  catch(_){if(!quiet)document.getElementById("e").textContent="Mot de passe incorrect / Senha incorreta";}
}
